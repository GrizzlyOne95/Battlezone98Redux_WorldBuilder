name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11']

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run unit tests
      run: python -m unittest discover -s tests -v
    
    - name: Verify imports and syntax
      run: |
        python -m py_compile world_builder.py world_builder_core.py hg2_codec.py mat_codec.py bzpaint.py maketrn_compat.py stock_map_creator.py legacy_port.py legacy_palette.py legacy_preflight.py legacy_preflight_hook.py legacy_port_cli.py msn_ter_codec.py msn2terrain.py
        python -c "import world_builder, bzpaint, maketrn_compat, stock_map_creator, legacy_port, legacy_palette, legacy_preflight, legacy_port_cli, msn_ter_codec, msn2terrain; print('Import successful')"
